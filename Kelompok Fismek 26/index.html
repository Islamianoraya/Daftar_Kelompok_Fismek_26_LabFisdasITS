    // Populate Filter Kelompok
    const uniqueKelompok = [...new Set(rawData.map(item => item.Kelompok))].sort((a,b) => parseInt(a) - parseInt(b));
    const filterKelompokSelect = document.getElementById('filterKelompok');
    uniqueKelompok.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = `Kelompok ${k}`;
      filterKelompokSelect.appendChild(opt);
    });

    const filterHari = document.getElementById('filterHari');
    const filterSesi = document.getElementById('filterSesi');
    const filterKelompok = document.getElementById('filterKelompok');
    const filterSearch = document.getElementById('filterSearch');
    const btnReset = document.getElementById('btnReset');
    const contentContainer = document.getElementById('contentContainer');
    const statTotal = document.getElementById('statTotal');
    const statusFilterText = document.getElementById('statusFilterText');

    function renderData() {
      const hVal = filterHari.value;
      const sVal = filterSesi.value;
      const kVal = filterKelompok.value;
      const qVal = filterSearch.value.toLowerCase().trim();

      const filtered = rawData.filter(item => {
        const matchHari = (hVal === 'ALL' || item.Hari === hVal);
        const matchSesi = (sVal === 'ALL' || item.Sesi === sVal);
        const matchKelompok = (kVal === 'ALL' || item.Kelompok === kVal);
        const matchSearch = (qVal === '' || 
          item.NAMA.toLowerCase().includes(qVal) || 
          item.NRP.toLowerCase().includes(qVal) || 
          item.PRODI.toLowerCase().includes(qVal)
        );
        return matchHari && matchSesi && matchKelompok && matchSearch;
      });

      statTotal.textContent = filtered.length;
      statusFilterText.textContent = `Menampilkan ${filtered.length} dari ${rawData.length} total mahasiswa`;

      if (filtered.length === 0) {
        contentContainer.innerHTML = `
          <div class="bg-white rounded-lg p-12 text-center border border-slate-200">
            <div class="text-slate-400 text-4xl mb-3">🔍</div>
            <h3 class="text-base font-bold text-slate-700">Tidak ada data yang sesuai filter</h3>
            <p class="text-xs text-slate-500 mt-1">Coba sesuaikan kata kunci atau kombinasi Hari, Sesi, dan Kelompok.</p>
          </div>
        `;
        return;
      }

      // Grouping data by Hari -> Sesi -> Kelompok
      const grouped = {};
      filtered.forEach(item => {
        const hKey = item.Hari;
        const sKey = `Sesi ${item.Sesi} (${item.Waktu})`;
        const kKey = `Kelompok ${item.Kelompok}`;

        if (!grouped[hKey]) grouped[hKey] = {};
        if (!grouped[hKey][sKey]) grouped[hKey][sKey] = {};
        if (!grouped[hKey][sKey][kKey]) grouped[hKey][sKey][kKey] = [];

        grouped[hKey][sKey][kKey].push(item);
      });

      let html = '';

      for (const hari in grouped) {
        for (const sesi in grouped[hari]) {
          html += `
            <div class="space-y-4">
              <div class="flex items-center gap-2 border-b-2 border-[#1b2a47] pb-2">
                <span class="bg-[#1b2a47] text-white text-xs font-bold px-3 py-1 rounded shadow-sm">${hari}</span>
                <span class="bg-[#eab308] text-slate-900 text-xs font-bold px-3 py-1 rounded shadow-sm">${sesi}</span>
              </div>

              <div class="grid grid-cols-1 gap-6">
          `;

          for (const kelompok in grouped[hari][sesi]) {
            const listMhs = grouped[hari][sesi][kelompok];
            const prodiSample = listMhs[0] ? listMhs[0].PRODI : '';
            const programSample = listMhs[0] ? listMhs[0].PROGRAM : '';

            html += `
              <div class="bg-white rounded-lg shadow-md border border-slate-200 overflow-hidden">
                <div class="bg-[#1b2a47] text-white px-5 py-3 font-bold text-sm flex flex-col sm:flex-row sm:items-center justify-between border-l-4 border-[#eab308] gap-2">
                  <div class="flex items-center gap-3">
                    <span class="text-[#eab308] font-bold text-base">${kelompok.toUpperCase()}</span>
                    <span class="text-xs bg-slate-700 text-slate-200 px-2.5 py-0.5 rounded-full font-normal">${listMhs.length} Mahasiswa</span>
                  </div>
                  <span class="text-xs text-slate-300 font-normal">${prodiSample} (${programSample})</span>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-xs text-left text-slate-700">
                    <thead class="text-xs text-white uppercase bg-[#0f172a] border-b border-slate-700">
                      <tr>
                        <th scope="col" class="px-4 py-2.5 text-center w-12">NO</th>
                        <th scope="col" class="px-4 py-2.5">NRP</th>
                        <th scope="col" class="px-4 py-2.5">NAMA MAHASISWA</th>
                        <th scope="col" class="px-4 py-2.5">PRODI</th>
                        <th scope="col" class="px-4 py-2.5">PROGRAM</th>
                        <th scope="col" class="px-4 py-2.5 text-center">HARI</th>
                        <th scope="col" class="px-4 py-2.5 text-center">SESI</th>
                        <th scope="col" class="px-4 py-2.5 text-center">WAKTU</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
            `;

            listMhs.forEach((mhs, idx) => {
              html += `
                <tr class="hover:bg-slate-50 transition">
                  <td class="px-4 py-2 text-center font-medium text-slate-500">${idx + 1}</td>
                  <td class="px-4 py-2 font-mono text-slate-600 font-semibold">${mhs.NRP}</td>
                  <td class="px-4 py-2 font-bold text-slate-800">${mhs.NAMA}</td>
                  <td class="px-4 py-2 text-slate-600">${mhs.PRODI}</td>
                  <td class="px-4 py-2"><span class="bg-blue-50 text-blue-700 border border-blue-200 text-[10px] px-2 py-0.5 rounded font-semibold">${mhs.PROGRAM}</span></td>
                  <td class="px-4 py-2 text-center font-semibold text-slate-700">${mhs.Hari}</td>
                  <td class="px-4 py-2 text-center font-semibold text-slate-700">${mhs.Sesi}</td>
                  <td class="px-4 py-2 text-center text-slate-500">${mhs.Waktu}</td>
                </tr>
              `;
            });

            html += `
                    </tbody>
                  </table>
                </div>
              </div>
            `;
          }

          html += `
              </div>
            </div>
          `;
        }
      }

      contentContainer.innerHTML = html;
    }

    filterHari.addEventListener('change', renderData);
    filterSesi.addEventListener('change', renderData);
    filterKelompok.addEventListener('change', renderData);
    filterSearch.addEventListener('input', renderData);

    btnReset.addEventListener('click', () => {
      filterHari.value = 'ALL';
      filterSesi.value = 'ALL';
      filterKelompok.value = 'ALL';
      filterSearch.value = '';
      renderData();
    });

    // Initial render
    renderData();
  </script>
